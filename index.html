<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRPG Reader">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14202b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>CRPG Reader</title>
<style>
:root{--bg:#14202b;--surf:#1d2d3b;--line:#2c4052;--txt:#e6e2d6;--dim:#93a3b1;--acc:#e0b04a;--accfg:#14202b;
--ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--read:"Iowan Old Style","Palatino Linotype",Georgia,serif}
@media(prefers-color-scheme:light){:root{--bg:#eef1f4;--surf:#fff;--line:#d3dbe2;--txt:#1b2733;--dim:#5d6e7d;--acc:#8a5a00;--accfg:#fff}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 var(--ui);
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;margin-top:calc(-1*env(safe-area-inset-top));display:flex;gap:12px;align-items:center}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:var(--acc);font:inherit;padding:6px 0;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px}
.cont{display:block;text-decoration:none;color:var(--accfg);background:var(--acc);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.cont small{display:block;opacity:.8}.cont b{display:block;font-size:19px}.cont span{opacity:.9}
input[type=search]{width:100%;font:inherit;color:var(--txt);background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:13px 2px;border-bottom:1px solid var(--line);color:var(--txt);text-decoration:none}
.row i{font-style:normal;color:var(--dim);font-size:14px;white-space:nowrap}
.row.cur{border-left:3px solid var(--acc);padding-left:10px}
.row.done{color:var(--dim)}
.fin{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px solid var(--line)}
.fin label{display:flex;gap:10px;align-items:center;cursor:pointer}
.fin button{font:14px var(--ui);color:var(--acc);background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.fin button:disabled{opacity:.4;cursor:default}
.fin input{width:22px;height:22px;accent-color:var(--acc)}
.more{margin:22px 0 6px;text-align:center}
.more button,.msg button{font:15px var(--ui);color:var(--acc);background:none;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
#mnu{position:absolute;right:12px;top:100%;min-width:250px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:20}
#mnu h4{margin:8px 10px 4px;font:600 12px var(--ui);color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
#mnu button{display:block;width:100%;text-align:left;padding:10px;border-radius:8px;color:var(--txt);font:16px var(--ui)}
#mnu button.on{color:var(--acc)}
#mnu button.on::after{content:' ✓'}
#mnu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#menu{font-size:24px;line-height:1;padding:4px 6px}
#vinfo{margin:2px 2px 0}
.msg{color:var(--dim);padding:24px 0;text-align:center}
article{font:19px/1.6 var(--read);overflow-wrap:break-word}
article h2{font:600 24px/1.25 var(--read);margin:.2em 0 .6em}
article img{max-width:100%!important;height:auto!important;border-radius:4px}
article .separator,article .tr-caption-container{margin:12px 0!important;text-align:center}
article table{max-width:100%}
article iframe{max-width:100%}
.nav{display:flex;gap:10px;margin:28px 0 12px}
.nav a,.nav span{flex:1;text-align:center;padding:13px;border-radius:10px;font:inherit;font-family:var(--ui);text-decoration:none}
.nav a{background:var(--acc);color:var(--accfg)}
.nav span{border:1px solid var(--line);color:var(--dim)}
.meta{color:var(--dim);font:14px var(--ui);margin-bottom:18px}
</style>
</head>
<body>
<header><button id="back" hidden>‹ Zurück</button><h1 id="ttl">CRPG Reader</h1><button id="menu" aria-label="Menü">⋮</button><div id="mnu" hidden></div></header>
<main id="app"></main>
<script>
const HOSTS=['https://crpgaddict.blogspot.com','https://www.crpgaddict.com'];
const FEED=HOSTS[0]+'/feeds';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=encodeURIComponent;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
try{Object.keys(localStorage).forEach(k=>{if(k==='labels'||k.startsWith('p:'))localStorage.removeItem(k)})}catch{}
let progress=store.get('progress2',{}); // Spiel -> {idx,id,title,scroll,ts,total,read:{}}
let done=store.get('done2',{});         // Spiel -> Zeitstempel (fertig gelesen)
let view=store.get('view',{sort:'az',filter:'all'}); // Sortierung und Anzeige
let redraw=null;
let games=store.get('games',null);      // [{n:Name, l:[[Pfad,Linktext],...]}]
let pmap=store.get('pmap',null);        // Pfad -> [PostId,Titel,Datum]
const cache={};
function save(){store.set('progress2',progress);store.set('done2',done)}
const keyOf=u=>u.replace(/^https?:\/\/[^\/]+/,'').split('#')[0].split('?')[0];

function jsonp(url,ms=15000){
  return new Promise((res,rej)=>{
    const cb='cb'+Math.random().toString(36).slice(2),el=document.createElement('script');
    const fin=()=>{clearTimeout(t);delete window[cb];el.remove()};
    const t=setTimeout(()=>{fin();rej(new Error('keine gültige Antwort'))},ms);
    window[cb]=d=>{fin();res(d)};
    el.onerror=()=>{fin();rej(new Error('Skript blockiert oder nicht erreichbar'))};
    el.src=url.replace('alt=json','alt=json-in-script')+'&callback='+cb;
    document.head.appendChild(el);
  });
}
async function getJSON(url,ms){
  const errs=[];
  for(const h of HOSTS){
    try{return await jsonp(url.replace(HOSTS[0],h),ms)}catch(e){errs.push(h.replace('https://','')+': '+e.message)}
  }
  throw new Error(errs.join(' | '));
}

function htmlToLines(html){
  const d=new DOMParser().parseFromString(html,'text/html');
  let out='';
  const BLOCK=/^(P|DIV|H1|H2|H3|H4|LI|TR|UL|OL|TABLE)$/;
  (function w(n){
    for(const c of n.childNodes){
      if(c.nodeType===3)out+=c.nodeValue;
      else if(c.nodeType===1){
        const t=c.tagName;
        if(t==='A')out+='\u0001'+(c.getAttribute('href')||'')+'\u0002'+c.textContent+'\u0003';
        else if(t==='BR')out+='\n';
        else{const b=BLOCK.test(t);if(b)out+='\n';w(c);if(b)out+='\n'}
      }
    }
  })(d.body);
  return out.split('\n');
}
function parseLines(lines){
  const out=[],seen=new Set();
  for(const line of lines){
    const i=line.indexOf('\u0001');if(i<1)continue;
    const name=line.slice(0,i).replace(/\s+/g,' ').replace(/:\s*P$/,'').replace(/[:\s]+$/,'').trim();
    if(name.length<2)continue;
    const links=[],ks=new Set();
    for(const m of line.matchAll(/\u0001(.*?)\u0002(.*?)\u0003/g)){
      const href=m[1],txt=m[2].trim();
      if(!/crpgaddict\.(blogspot\.[a-z.]+|com)\/\d{4}\/\d\d\//.test(href))continue;
      if(/^https?:/i.test(txt)||txt==='M')continue;
      const k=keyOf(href);if(ks.has(k))continue;
      ks.add(k);links.push([k,txt]);
    }
    if(!links.length)continue;
    let n=name,c=2;while(seen.has(n))n=name+' #'+(c++);
    seen.add(n);out.push({n,l:links});
  }
  return out;
}

async function setup(say,full){
  say('Lade Spielverzeichnis …');
  const pg=await getJSON(FEED+'/pages/default?alt=json&max-results=50');
  const ents=pg.feed.entry||[];
  const e=ents.find(x=>/Index of Games Played by Title/i.test(x.title.$t))
    ||ents.find(x=>(x.link||[]).some(l=>/blog-page_3/.test(l.href||'')));
  if(!e)throw new Error('Spielverzeichnis nicht gefunden');
  const g=parseLines(htmlToLines(e.content.$t));
  if(!g.length)throw new Error('Spielverzeichnis konnte nicht gelesen werden');
  games=g;store.set('games',games);
  pmap=full?{}:(pmap||{});
  const S=FEED+'/posts/summary';
  let i=1,total=0;
  while(i<=30000){
    say(total?`Lade Beitragsverzeichnis: ${i-1} von ${total} …`:'Lade Beitragsverzeichnis …');
    const r=await getJSON(`${S}?alt=json&max-results=500&start-index=${i}`,60000);
    const en=r.feed.entry||[];
    total=+((r.feed['openSearch$totalResults']||{}).$t)||total;
    if(!en.length)break;
    for(const x of en){
      const a=(x.link||[]).find(l=>l.rel==='alternate');if(!a)continue;
      pmap[keyOf(a.href)]=[(x.id.$t.match(/post-(\d+)/)||[])[1],x.title.$t,(x.published.$t||'').slice(0,10)];
    }
    i+=en.length;
    if(!full||(total&&i>total))break;
  }
  store.set('pmap',pmap);
}
async function loadPost(k){
  if(cache[k])return cache[k];
  const m=pmap&&pmap[k];let e;
  if(m&&m[0]){try{e=(await getJSON(`${FEED}/posts/default/${m[0]}?alt=json`,30000)).entry}catch{}}
  if(!e){e=((await getJSON(`${FEED}/posts/default?alt=json&path=${enc(k)}`,30000)).feed.entry||[])[0]}
  if(!e)throw new Error('Beitrag nicht gefunden');
  return cache[k]={title:e.title.$t,date:(e.published.$t||'').slice(0,10),html:(e.content||e.summary||{$t:''}).$t,
    url:((e.link||[]).find(l=>l.rel==='alternate')||{}).href};
}

function setHead(t,back){$('#ttl').textContent=t;$('#back').hidden=!back;$('#menu').hidden=!!back;$('#mnu').hidden=true}
const yearOf=n=>{const m=n.match(/\((\d{4})/);return m?+m[1]:9999};
const dateOf=g=>{
  let b='9999';
  for(const [k] of g.l){
    const m=pmap&&pmap[k],pm=k.match(/^\/(\d{4})\/(\d\d)\//);
    const d=(m&&m[2])||(pm?pm[1]+'-'+pm[2]:'');
    if(d&&d<b)b=d;
  }
  return b;
};
const stOf=g=>done[g.n]?'done':progress[g.n]?'reading':'new';
function visible(q){
  const az=(a,b)=>a.n.localeCompare(b.n,'en',{numeric:true});
  let f=games.filter(g=>g.n.toLowerCase().includes(q));
  if(view.filter!=='all')f=f.filter(g=>stOf(g)===view.filter);
  if(view.sort==='year')return f.sort((a,b)=>yearOf(a.n)-yearOf(b.n)||az(a,b));
  if(view.sort==='played'){
    const dk=new Map(f.map(g=>[g,dateOf(g)]));
    return f.sort((a,b)=>dk.get(a)<dk.get(b)?-1:dk.get(a)>dk.get(b)?1:az(a,b));
  }
  return f.sort(az);
}

async function home(){
  setHead('CRPG Reader',false);
  if(!games||!pmap){
    app.innerHTML='<div class="msg" id="sm">Einmalige Einrichtung …<br>Das dauert ein bis zwei Minuten.</div>';
    try{await setup(t=>{const s=$('#sm');if(s)s.textContent=t},true)}
    catch(e){app.innerHTML=`<div class="msg">Einrichtung fehlgeschlagen.<br><small>${esc(e.message)}</small><br><br><button id="retry">Nochmal versuchen</button></div>`;$('#retry').onclick=()=>route();return}
  }
  const last=Object.entries(progress).sort((a,b)=>b[1].ts-a[1].ts)[0];
  app.innerHTML=(last?`<a class="cont" href="#/p/${enc(last[0])}/${last[1].idx}"><small>Weiterlesen</small><b>${esc(last[0])}</b><span>${esc(last[1].title)}</span></a>`:'')
    +'<input id="q" type="search" placeholder="Spiel suchen" autocomplete="off"><div id="vinfo" class="meta"></div><div id="list"></div>';
  const draw=()=>{
    if(!$('#list'))return;
    const f=visible($('#q').value.trim().toLowerCase());
    const bits=[];
    if(view.filter!=='all')bits.push({new:'Noch nicht gelesen',reading:'Gerade am Lesen',done:'Fertig gelesen'}[view.filter]);
    if(view.sort!=='az')bits.push({played:'In gespielter Reihenfolge',year:'Nach Erscheinungsjahr'}[view.sort]);
    $('#vinfo').textContent=bits.length?`${f.length} Spiele · ${bits.join(' · ')}`:'';
    $('#list').innerHTML=f.length?f.map(g=>{
      const p=progress[g.n],d=done[g.n];
      return `<a class="row${d?' done':''}" href="#/g/${enc(g.n)}"><span>${esc(g.n)}</span>${d?'<i>✓ fertig</i>':p?`<i>Beitrag ${p.idx+1}/${g.l.length}</i>`:''}</a>`;
    }).join(''):'<div class="msg">Keine Spiele in dieser Ansicht.</div>';
  };
  redraw=draw;
  $('#q').oninput=draw;draw();
}

function game(name){
  setHead(name,true);
  const g=games&&games.find(x=>x.n===name);
  if(!g){location.hash='#/';return}
  const p=progress[name]||{};
  const rows=g.l.map(([k,t],i)=>{
    const m=pmap&&pmap[k],cls=i===p.idx?'row cur':(p.read&&p.read[k]?'row done':'row');
    return `<a class="${cls}" href="#/p/${enc(name)}/${i}"><span>${esc(m?m[1]:t)}</span><i>${esc(t)}</i></a>`;
  }).join('');
  app.innerHTML=`<div class="fin"><label><input type="checkbox" id="fin"${done[name]?' checked':''}> Fertig gelesen</label><button id="rst"${progress[name]?'':' disabled'}>Fortschritt zurücksetzen</button></div>`+rows;
  $('#fin').onchange=e=>{
    if(e.target.checked){
      if(!confirm('Als fertig gelesen markieren? Dein Lesefortschritt für dieses Spiel wird gelöscht.')){e.target.checked=false;return}
      done[name]=Date.now();delete progress[name];
    }else delete done[name];
    save();game(name);
  };
  $('#rst').onclick=()=>{
    if(!confirm('Lesefortschritt für dieses Spiel zurücksetzen? Die gemerkte Stelle und die Gelesen-Markierungen werden gelöscht.'))return;
    delete progress[name];save();game(name);
  };
  const cur=app.querySelector('.cur');if(cur)cur.scrollIntoView({block:'center'});
}

async function post(name,idx){
  setHead(name,true);
  const g=games&&games.find(x=>x.n===name);
  if(!g){location.hash='#/';return}
  const lk=g.l[idx];
  if(!lk){location.hash='#/g/'+enc(name);return}
  app.innerHTML='<div class="msg">Lade Beitrag …</div>';
  let x;
  try{x=await loadPost(lk[0])}
  catch(e){app.innerHTML=`<div class="msg">Beitrag konnte nicht geladen werden.<br><small>${esc(e.message)}</small></div>`;return}
  const old=progress[name]||{read:{}};
  const resume=old.idx===idx?old.scroll||0:0;
  if(old.idx!==undefined&&old.idx!==idx&&old.id)old.read[old.id]=1;
  progress[name]={idx,id:lk[0],title:x.title,scroll:resume,ts:Date.now(),total:g.l.length,read:old.read||{}};
  save();
  const prev=idx>0?`<a href="#/p/${enc(name)}/${idx-1}">‹ Vorheriger</a>`:'<span>‹ Vorheriger</span>';
  const next=idx<g.l.length-1?`<a href="#/p/${enc(name)}/${idx+1}">Nächster ›</a>`:`<a href="#" id="fin">${done[name]?'✓ Fertig gelesen (rückgängig)':'Fertig gelesen ✓'}</a>`;
  app.innerHTML=`<article><h2>${esc(x.title)}</h2><div class="meta">${x.date} · Beitrag ${idx+1} von ${g.l.length}${x.url?` · <a href="${esc(x.url)}" target="_blank" rel="noopener">Original</a>`:''}</div>${x.html}</article><div class="nav">${prev}${next}</div>`;
  app.querySelectorAll('article a').forEach(a=>{a.target='_blank';a.rel='noopener'});
  const fb=$('#fin');if(fb)fb.onclick=e=>{e.preventDefault();finish(name,idx)};
  window.scrollTo(0,resume);
}

let sv;
addEventListener('scroll',()=>{
  const m=location.hash.split('/');if(m[1]!=='p')return;
  clearTimeout(sv);
  sv=setTimeout(()=>{
    const name=decodeURIComponent(m[2]||''),p=progress[name];
    if(!p||p.idx!==+m[3])return;
    p.scroll=Math.round(scrollY);p.ts=Date.now();
    if(scrollY+innerHeight>=document.documentElement.scrollHeight-200)p.read[p.id]=1;
    save();
  },300);
},{passive:true});

function finish(name,idx){
  if(done[name]){delete done[name];save();post(name,idx);return}
  if(!confirm('Als fertig gelesen markieren? Dein Lesefortschritt für dieses Spiel wird gelöscht.'))return;
  done[name]=Date.now();delete progress[name];save();location.hash='#/';
}
function route(){
  const [,t,a,b]=location.hash.slice(1).split('/').map(s=>s&&decodeURIComponent(s));
  if(t==='g'&&a)game(a);else if(t==='p'&&a)post(a,+b||0);else home();
  if(t!=='p')window.scrollTo(0,0);
}
addEventListener('hashchange',route);
$('#back').onclick=()=>{const m=location.hash.split('/');location.hash=m[1]==='p'?'#/g/'+m[2]:'#/'};
function drawMenu(){
  const o=(g,v,t)=>`<button data-g="${g}" data-v="${v}"${view[g]===v?' class="on"':''}>${t}</button>`;
  $('#mnu').innerHTML='<h4>Sortieren</h4>'+o('sort','az','Alphabetisch')+o('sort','played','In gespielter Reihenfolge')+o('sort','year','Nach Erscheinungsjahr')
    +'<hr><h4>Anzeigen</h4>'+o('filter','all','Alle Spiele')+o('filter','new','Noch nicht gelesen')+o('filter','reading','Gerade am Lesen')+o('filter','done','Fertig gelesen')
    +'<hr><button id="mreload">Neu laden</button>';
}
async function reloadAll(){
  const b=$('#menu');b.textContent='…';b.disabled=true;
  try{await setup(()=>{},false)}catch(e){alert('Aktualisieren fehlgeschlagen: '+e.message)}
  b.textContent='⋮';b.disabled=false;route();
}
$('#menu').onclick=e=>{e.stopPropagation();const m=$('#mnu');if(m.hidden){drawMenu();m.hidden=false}else m.hidden=true};
$('#mnu').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  $('#mnu').hidden=true;
  if(b.id==='mreload'){reloadAll();return}
  view[b.dataset.g]=b.dataset.v;store.set('view',view);
  if(redraw)redraw();
};
document.addEventListener('click',e=>{if(!e.target.closest('#mnu'))$('#mnu').hidden=true});
route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
